name: Build/release

on:
  push:

permissions:
  contents: write

jobs:
  BuildOrRelease:
    # the type of machine to run the job on
    runs-on: ${{ matrix.os }}

    # create a build matrix for jobs
    strategy:
      # let the Windows build finish even when the Linux one fails, and vice versa
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: ⚙️ Check out Git repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # electron-builder needs: rpmbuild (rpm), bsdtar (pacman), flatpak +
      # flatpak-builder + eu-strip (flatpak). AppImage, deb and snap need
      # nothing extra. The flatpak runtime/sdk are installed from Flathub by
      # flatpak-builder itself.
      - name: ⚙️ Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: ⚙️📦️ Build
        run: yarn install --frozen-lockfile && yarn icons && yarn run electron-builder --publish never

      - name: 🌐️ Upload results
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.pacman
            dist/*.deb
            dist/*.snap
            dist/*.rpm
            dist/*.flatpak
            dist/*.exe

      - name: 🚀️ release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/*"
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
